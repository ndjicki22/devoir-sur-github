<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewpot" content="width=device-width,initial-scale=1.0">
        <title>Gestion des livres</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1>Gestion des livres</h1>
            <p>Bienvenue dans notre bobliotheque</p>
        </header>
        <nav>
            <a href="#">Accueil</a>
            <a href="#ajouter">Ajouter un livre</a>
            <a href="#liste">Liste des livres</a>
        </nav>
        <main>
            <section id="ajouter">
                <h2>Ajouter un livre</h2>
                <form>
                    <label>Titre du livre:</label>
                    <input type="text"placeholder="Nom de l'auteur">
                    <label>Categorie:</label>
                    <input type="=text"placeholder="Categorie">
                    <button type="button">Ajouter</button>
                </form>
            </section>
            <section id="liste">
                <h2>Liste des livres</h2>
                <table>
                    <tr>
                        <th>Titre</th>
                        <th>Auteur</th>
                        <th>Categorie</th>
                        <th>Disponibilite</th>
                    </tr>
                    <tr>
                        <td>Les miserable</td>
                        <td>Victor Hugo</td>
                        <td>Roman</td>
                        <td>Disponible</td>
                    </tr>
                    <tr>
                        <td>Le petit prince</td>
                        <td>Antoine de Saint-Exupery</td>
                        <td>Conte</td>
                        <td>Disponible</td>
                    </tr>
                </table>
            </section>
        </main>
    </body>
</html>
